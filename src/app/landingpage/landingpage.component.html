<div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white flex flex-col justify-center items-center pt-6">
    <div class="text-center px-6">
        <h1 class="text-4x1 font-bold mb-4">
            Bem Vindo a sua Lista de Lugares Favoritos!
        </h1>
        <p class="text-lg mb-6">
            Explore, organize e copmpartilhe os lugares incríveis que você adora. Tudo em um só lugar
        </p>

        <button *ngIf="isLoggedIn()" (click)="navegar();"
                class="bg-white text-blue-400 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center mb-6">
            Olá {{ profile?.name }}, clique aqui para aproveitar o site!
        </button>

        <button *ngIf="!isLoggedIn()" (click)="logarComGoogle();"
                class="bg-white text-blue-700 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center mb-6">
            <img width="50px"
                 src="https://s3-alpha.figma.com/hub/file/2729744958/2a5758d6-4edb-4047-87bb-e6b94dbbbab0-cover.png">
            Logar com Google
        </button>

    </div>
</div>
